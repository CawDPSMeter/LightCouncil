# Automatisch auf CurseForge veröffentlichen
#
# Läuft, sobald ein Tag v<Version> gepusht wird (z. B. v0.22.1). Die Version im Tag muss mit
# „## Version:“ in LightCouncil.toc übereinstimmen. Das Addon wird gebaut und mit dem passenden
# Abschnitt aus CHANGELOG.md auf CurseForge hochgeladen.
#
#   git tag v0.22.1
#   git push origin main v0.22.1
#
# Benötigt das Repository-Secret CF_API_KEY (CurseForge → Account → API Tokens).
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Token und Version prüfen
        id: ver
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          if [ -z "$CF_API_KEY" ]; then
            echo "::error::Secret CF_API_KEY fehlt (GitHub → Settings → Secrets and variables → Actions)."
            exit 1
          fi
          tag="${GITHUB_REF_NAME#v}"
          toc=$(grep -m1 '^## Version:' LightCouncil.toc | sed 's/^## Version:[[:space:]]*//' | tr -d '\r[:space:]')
          echo "Tag: $tag  ·  toc: $toc"
          if [ "$tag" != "$toc" ]; then
            echo "::error::Tag v$tag passt nicht zur Version $toc in LightCouncil.toc."
            exit 1
          fi
          echo "version=$toc" >> "$GITHUB_OUTPUT"

      - name: Changelog der Version
        run: |
          awk -v v="${{ steps.ver.outputs.version }}" '
            { sub(/\r$/, "") }
            /^## / { if (on) exit; on = ($2 == v) }
            on { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          [ -s RELEASE_NOTES.md ] || echo "## ${{ steps.ver.outputs.version }}" > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Bauen und auf CurseForge hochladen
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}

      - name: Prüfen, ob gebaut wurde
        run: |
          ls .release/*.zip >/dev/null 2>&1 || { echo "::error::Der Packager hat keine Datei gebaut – Log oben prüfen."; exit 1; }
